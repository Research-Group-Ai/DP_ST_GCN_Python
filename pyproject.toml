[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-st-gcn-reconstructed"
version = "0.1.0"
description = "Reconstructed dual-person skeleton action recognition methodology"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "numpy>=1.26,<3", "scikit-learn>=1.3,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["dpstgcn*"]
